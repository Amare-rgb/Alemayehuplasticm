[build]
  command   = "npm install && npx prisma generate"
  publish   = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma", "bcrypt", "sharp"]
  included_files = [
    "prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**"
  ]

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true